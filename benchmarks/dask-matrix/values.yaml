scheduler:
  image:
    repository: "dask-matrix-dask"
    tag: "2024.1.0-arm64-r1"
    pullPolicy: Never
  resources:
    limits:
      memory: "1Gi"
    requests:
      memory: "1Gi"

worker:
  image:
    repository: "dask-matrix-dask"
    tag: "2024.1.0-arm64-r1"
    pullPolicy: Never
  replicas: 2  
  env:
    - name: DASK_DISTRIBUTED__WORKER__USE_NANNY
      value: "False"
    - name: DASK_DISTRIBUTED__WORKER__MEMORY__TARGET
      value: "False"
    - name: DASK_DISTRIBUTED__WORKER__MEMORY__SPILL
      value: "False"
    - name: DASK_DISTRIBUTED__WORKER__MEMORY__PAUSE
      value: "False"
    - name: DASK_DISTRIBUTED__WORKER__MEMORY__TERMINATE
      value: "False"
  extraArgs:
    - "--no-nanny"
  resources:
    limits:
      memory: "2Gi" 
    requests:
      memory: "2Gi" 

jupyter:
  enabled: false