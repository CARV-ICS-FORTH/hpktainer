apiVersion: batch/v1
kind: Job
metadata:
  name: dask-matrix-client
spec:
  template:
    spec:
      containers:
      - name: client
        image: dask-matrix-client:2024.1.0-arm64-r1
        imagePullPolicy: Never
        command: ["python", "/app/benchmark.py"]
        env:
        - name: MATRIX_SIZE
          value: "4000"
        - name: CHUNK_SIZE
          value: "500"
        volumeMounts:
        - name: report
          mountPath: /report
      restartPolicy: Never
      volumes:
      - name: report
        emptyDir: {}
  backoffLimit: 1