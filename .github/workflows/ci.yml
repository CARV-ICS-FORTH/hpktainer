name: CI

on:
  push:
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: Build, Fmt, Vet, Test & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check gofmt
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Build binaries (linux/amd64)
        run: make binaries-linux-amd64

      - name: Build binaries (linux/arm64)
        run: make binaries-linux-arm64

      - name: Run tests
        run: make test

      - name: Run shellcheck
        run: shellcheck --severity=error $(find . -name "*.sh" -not -path "*/.*")
